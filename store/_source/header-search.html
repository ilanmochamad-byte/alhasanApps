<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>header &amp; search results</title>
<style>
@font-face{font-family:PJS;src:url(../../node_modules/@expo-google-fonts/plus-jakarta-sans/500Medium/PlusJakartaSans_500Medium.ttf);font-weight:500}
@font-face{font-family:PJS;src:url(../../node_modules/@expo-google-fonts/plus-jakarta-sans/700Bold/PlusJakartaSans_700Bold.ttf);font-weight:700}
@font-face{font-family:PJS;src:url(../../node_modules/@expo-google-fonts/plus-jakarta-sans/800ExtraBold/PlusJakartaSans_800ExtraBold.ttf);font-weight:800}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{background:#0E4A27}
body{font-family:PJS,system-ui,sans-serif}
.stage{position:relative;overflow:hidden;color:#fff;
  background:
    radial-gradient(50% 60% at 50% 85%, rgba(201,245,1,.14) 0%, rgba(201,245,1,0) 70%),
    radial-gradient(45% 60% at 10% 100%, rgba(98,201,133,.16) 0%, rgba(98,201,133,0) 70%),
    radial-gradient(45% 60% at 90% 100%, rgba(98,201,133,.14) 0%, rgba(98,201,133,0) 70%),
    linear-gradient(170deg,#0C3F22 0%,#0F4F2B 40%,#145C33 100%)}
/* Pola halus geometris di latar */
.stage::before{content:'';position:absolute;inset:0;opacity:.07;
  background-image:radial-gradient(circle at 1px 1px,#fff 1.2px,transparent 1.6px);background-size:28px 28px}
.ph{position:absolute;background:#0A110D;padding:10px;border-radius:58px;
  box-shadow:0 40px 90px rgba(3,20,10,.55),0 0 0 1.5px rgba(255,255,255,.14) inset}
.ph .scr{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:#F3F6F3}
.ph img{position:absolute;left:0;width:100%;display:block}
.cap{font-weight:700;letter-spacing:.2px;color:#EAF7EE}

/* ===== Header 21:9 (1920×823 CSS → 3840×1646) ===== */
#header{width:1920px;height:823px}
#header .top{position:absolute;left:0;right:0;top:64px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
#header .logo{height:92px}
#header h1{font-size:62px;line-height:1.05;font-weight:800;letter-spacing:-1.6px}
#header h1 em{font-style:normal;color:#C9F501}
#header .ph{width:372px;height:806px;top:330px}
#header .ph.c{left:774px;top:300px;z-index:3}
#header .ph.l{left:410px;transform:rotate(-6deg);z-index:2}
#header .ph.r{left:1138px;transform:rotate(6deg);z-index:2}

/* ===== Hasil pencarian 3:2 (1920×1280 CSS → 3840×2560) ===== */
#search{width:1920px;height:1280px}
#search .top{position:absolute;left:0;right:0;top:78px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
#search .logo{height:70px}
#search h1{font-size:64px;line-height:1.08;font-weight:800;letter-spacing:-1.6px}
#search h1 em{font-style:normal;color:#C9F501}
#search .col{position:absolute;top:356px;width:452px;display:flex;flex-direction:column;align-items:center;gap:26px}
#search .col .cap{font-size:34px}
#search .col .ph{position:relative;width:452px;height:980px}
#search .c1{left:216px}
#search .c2{left:734px}
#search .c3{left:1252px}
</style>
</head>
<body>

<div class="stage" id="header">
  <div class="top">
    <img class="logo" src="../../assets/images/Logo_alhasanApps_dark.png" alt="">
    <h1>Selalu dekat dengan <em>santri</em></h1>
  </div>
  <div class="ph l"><div class="scr"><img src="header-search/layar-jadwal.png" style="top:-56px"></div></div>
  <div class="ph c"><div class="scr"><img src="header-search/layar-beranda.png" style="top:-56px"></div></div>
  <div class="ph r"><div class="scr"><img src="header-search/layar-kesehatan.png" style="top:0"></div></div>
</div>

<div class="stage" id="search">
  <div class="top">
    <img class="logo" src="../../assets/images/Logo_alhasanApps_dark.png" alt="">
    <h1>Jadwal, izin, rapor, dan<br><em>kesehatan santri</em></h1>
  </div>
  <div class="col c1"><div class="cap">Sesi hari ini</div><div class="ph"><div class="scr"><img src="header-search/layar-beranda.png" style="top:-56px"></div></div></div>
  <div class="col c2"><div class="cap">Jadwal mengajar</div><div class="ph"><div class="scr"><img src="header-search/layar-jadwal.png" style="top:-56px"></div></div></div>
  <div class="col c3"><div class="cap">Kabar kesehatan anak</div><div class="ph"><div class="scr"><img src="header-search/layar-kesehatan.png" style="top:0"></div></div></div>
</div>

</body>
</html>
