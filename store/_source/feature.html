<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>feature graphic</title>
<style>
@font-face{font-family:Inter;src:url('node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2');font-weight:500}
@font-face{font-family:Inter;src:url('node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2');font-weight:700}
@font-face{font-family:Inter;src:url('node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2') format('woff2');font-weight:800}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:Inter,system-ui,sans-serif}
.stage{width:1024px;height:500px;position:relative;overflow:hidden;display:flex;align-items:center;
  background:linear-gradient(118deg,#1E7A44 0%,#146034 44%,#0A3A1E 100%)}
.stage::before{content:'';position:absolute;top:-58%;left:34%;width:56%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(201,245,1,.26) 0%,rgba(201,245,1,0) 68%)}
.stage::after{content:'';position:absolute;bottom:-62%;left:-12%;width:52%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(98,201,133,.24) 0%,rgba(98,201,133,0) 70%)}
.left{position:relative;z-index:2;padding:0 0 0 68px;width:596px;display:flex;flex-direction:column;gap:20px}
.mark{display:flex;align-items:center;gap:16px}
.mark img{height:74px;width:74px;border-radius:17px;box-shadow:0 10px 26px rgba(3,20,10,.4)}
.mark .name{display:flex;flex-direction:column;gap:2px}
.mark b{font-size:27px;font-weight:800;color:#fff;letter-spacing:-.4px}
.mark span{font-size:13px;font-weight:700;letter-spacing:2px;color:#C9F501;text-transform:uppercase}
h1{font-size:32px;line-height:1.22;font-weight:800;letter-spacing:-.7px;color:#fff;max-width:492px}
p{font-size:16px;line-height:1.5;font-weight:500;color:rgba(232,246,236,.82);max-width:460px}
.pills{display:flex;gap:9px;flex-wrap:wrap;padding-top:2px}
.pill{border:1px solid rgba(201,245,1,.34);background:rgba(255,255,255,.08);color:#EAF7EE;
  border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:700}
.right{position:absolute;right:-14px;top:0;height:100%;width:452px;z-index:2;
  display:flex;align-items:center;justify-content:center}
.ph{position:absolute;background:#0A0F0C;border-radius:34px;padding:7px;
  box-shadow:0 30px 70px rgba(3,20,10,.55),0 0 0 1.2px rgba(255,255,255,.16) inset}
.ph img{display:block;width:100%;border-radius:27px;background:#F4F7F4}
.ph.a{width:222px;transform:rotate(-7deg);left:6px;top:52px}
.ph.b{width:222px;transform:rotate(6deg);left:196px;top:104px}
</style>
</head>
<body>
<div class="stage">
  <div class="left">
    <div class="mark">
      <img src="assets/ios-icon-default.png">
      <div class="name"><b>Al Hasan Apps</b><span>Pesantren Al Hasan</span></div>
    </div>
    <h1>Jadwal, absensi, dan perizinan<br>santri dalam satu aplikasi</h1>
    <p>Buka absensi dari kartu sesi hari ini, proses antrean izin sesuai peran, lalu cetak rekap kehadiran jadi PDF.</p>
    <div class="pills">
      <div class="pill">Jadwal &amp; absensi</div>
      <div class="pill">Perizinan santri</div>
      <div class="pill">Laporan PDF</div>
    </div>
  </div>
  <div class="right">
    <div class="ph a"><img src="build/screen-phone-izin.png"></div>
    <div class="ph b"><img src="build/screen-phone-beranda.png"></div>
  </div>
</div>
</body>
</html>
