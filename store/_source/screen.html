*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);font-size:15px;line-height:21px;font-weight:500}
.device{width:var(--dw,390px);height:var(--dh,844px);overflow:hidden;position:relative;background:var(--bg)}

/* ---------- status bar ---------- */
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--inset);display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:700;letter-spacing:.2px;z-index:5;
  color:var(--text)}
.sb-r{display:flex;align-items:center;gap:6px}
.sig{display:flex;align-items:flex-end;gap:2px;height:11px}
.sig i{width:3px;background:var(--text);border-radius:1px;display:block}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8.5px}.sig i:nth-child(4){height:11px}
.wifi{width:15px;height:11px;background:var(--text);
  -webkit-mask:radial-gradient(circle at 50% 100%, #000 0 3px, transparent 3.5px) no-repeat,
   radial-gradient(circle at 50% 100%, transparent 0 5.5px, #000 6px 8px, transparent 8.5px) no-repeat,
   radial-gradient(circle at 50% 100%, transparent 0 10.5px, #000 11px 13px, transparent 13.5px) no-repeat;
  -webkit-mask-size:100% 100%}
.batt{width:24px;height:12px;border:1.6px solid var(--text);border-radius:3.5px;position:relative;opacity:.9}
.batt::after{content:'';position:absolute;top:2px;left:2px;bottom:2px;width:13px;background:var(--text);border-radius:1.5px}
.batt::before{content:'';position:absolute;right:-3.5px;top:3.5px;height:5px;width:2px;background:var(--text);border-radius:0 2px 2px 0;opacity:.55}

/* ---------- scroll content ---------- */
.scroll{position:absolute;inset:0;overflow:hidden;padding:calc(var(--inset) + 8px) 16px 130px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap.g16{gap:16px}
.wrap.g12{gap:12px}

/* ---------- typography ---------- */
.h1{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.4px}
.h2{font-size:17px;line-height:22px;font-weight:800}
.h3{font-size:15px;line-height:20px;font-weight:800}
.body{font-size:15px;line-height:21px;font-weight:500}
.bodyBold{font-size:15px;line-height:21px;font-weight:700}
.label{font-size:13px;line-height:17px;font-weight:800}
.cap{font-size:12px;line-height:16px;font-weight:600}
.ov{font-size:11px;line-height:14px;font-weight:800;letter-spacing:.6px}
.t2{color:var(--text2)}.tm{color:var(--muted)}.tp{color:var(--primary)}
.tw{color:var(--warning)}.td{color:var(--danger)}

/* ---------- header ---------- */
.hrow{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.hrow .h1{flex:1}
.logo{height:30px;width:86px;object-fit:contain;object-position:left center}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:var(--rMd);border:1px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--primary);position:relative;flex:none}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--bg)}
.greet{display:flex;flex-direction:column;gap:3px;padding-bottom:12px}
.greetName{font-size:21px;line-height:26px;font-weight:800;letter-spacing:-.2px}

/* ---------- surfaces ---------- */
.card{border:1px solid var(--border);border-radius:var(--rXl);background:var(--card);padding:14px;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--elCard)}
.panel{border:1px solid var(--border);border-radius:var(--rXxl);background:var(--card);padding:16px;
  display:flex;flex-direction:column;gap:12px}
.divider{height:1px;background:var(--divider)}
.sech{display:flex;align-items:baseline;gap:10px}
.sech .h2{flex:1}

/* ---------- hero ---------- */
.hero{border:1px solid var(--hero);border-radius:var(--rHero);background:var(--hero);padding:18px;
  display:flex;flex-direction:column;gap:12px;box-shadow:var(--elBrand)}
.heroBody{display:flex;align-items:flex-start;gap:14px}
.heroTime{border-right:1px solid var(--heroAccent);padding-right:14px;display:flex;flex-direction:column;gap:1px}
.heroStart{font-size:23px;line-height:26px;font-weight:800;color:var(--heroText);font-variant-numeric:tabular-nums}
.heroEnd{font-size:12px;line-height:15px;font-weight:600;color:var(--heroText2);font-variant-numeric:tabular-nums}
.heroTitle{font-size:17px;line-height:22px;font-weight:800;color:var(--heroText)}
.heroBtn{min-height:48px;border-radius:var(--rMd);background:var(--card);display:flex;align-items:center;
  justify-content:center;gap:8px;color:var(--primary);font-size:15px;font-weight:700}

/* ---------- quick tiles ---------- */
.quickRow{display:flex;gap:9px}
.quick{flex:1;min-height:76px;border:1px solid var(--border);border-radius:var(--rLg);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:0 4px;color:var(--primary)}
.quick span{font-size:11px;line-height:13px;font-weight:700;color:var(--text);white-space:nowrap}

/* ---------- schedule card ---------- */
.sched{flex-direction:row;gap:13px;align-items:stretch}
.sched .time{width:52px;display:flex;flex-direction:column;gap:2px}
.timeStart{font-size:15px;line-height:19px;font-weight:800;font-variant-numeric:tabular-nums}
.timeEnd{font-size:12px;line-height:15px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.rail{width:2px;border-radius:2px;background:var(--bgSel)}
.rail.on{background:var(--primary)}
.sbody{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.titleRow{display:flex;align-items:flex-start;gap:8px}
.titleRow .h3{flex:1}

/* ---------- badges & chips ---------- */
.badge{border:1px solid var(--border);background:var(--bgEl);color:var(--text2);border-radius:999px;
  padding:3px 10px;font-size:11px;line-height:14px;font-weight:800;align-self:flex-start;white-space:nowrap}
.badge.primary{background:var(--primarySoft);border-color:var(--primaryBorder);color:var(--primary)}
.badge.warning{background:var(--warningSoft);border-color:var(--warningBorder);color:var(--warning)}
.badge.danger{background:var(--dangerSoft);border-color:var(--dangerBorder);color:var(--danger)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--bgEl);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--text2)}
.chip.sel{background:var(--primary);border-color:var(--primary);color:var(--onPrimary);font-weight:800}

/* ---------- segmented ---------- */
.seg{height:48px;border-radius:var(--rMd);background:var(--bgEl);padding:4px;display:flex;gap:4px}
.seg > div{flex:1;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;font-weight:700;color:var(--text2)}
.seg > div.on{background:var(--card);box-shadow:0 1px 3px rgba(18,42,25,.10);color:var(--text);font-weight:800}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary);color:#fff;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* ---------- search ---------- */
.search{min-height:48px;border:1px solid var(--border);border-radius:var(--rMd);background:var(--card);
  display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted)}
.search .ph{flex:1;font-size:15px;font-weight:500;color:var(--muted)}

/* ---------- izin card ---------- */
.izin{flex-direction:row;padding:0;gap:0;overflow:hidden}
.stripe{width:4px;flex:none}
.ibody{flex:1;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ihead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.iident{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.range{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.rangeText{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.ifoot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--divider);margin-top:2px;padding-top:8px}
.ifoot .ov{flex:1;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act{font-size:12px;line-height:16px;font-weight:800;color:var(--primary);white-space:nowrap}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- stat tiles ---------- */
.statRow{display:flex;gap:12px}
.tile{flex:1;border:1px solid var(--border);background:var(--card);border-radius:var(--rLg);padding:14px;
  display:flex;flex-direction:column;gap:3px;justify-content:center}
.tile.on{background:var(--primary);border-color:var(--primary)}
.tile .v{font-size:30px;line-height:34px;font-weight:800;font-variant-numeric:tabular-nums}
.tile.on .v{color:var(--onPrimary)}
.tile .l{font-size:11px;line-height:14px;font-weight:800;letter-spacing:.6px;color:var(--muted)}
.tile.on .l{color:var(--heroText2)}
.tileRow{display:flex;gap:8px;padding:2px 0}
.tileRow .tile{flex:none;width:104px;min-height:62px;padding:10px}
.tileRow .tile .v{font-size:19px;line-height:23px}

/* ---------- recap ---------- */
.recapHead{display:flex;align-items:baseline;gap:8px}
.recapHead .h3{flex:1}
.bar{display:flex;gap:2px;height:14px}
.bar i{height:14px;display:block;border-radius:4px}
.bar i:first-child{border-radius:7px 4px 4px 7px}
.bar i:last-child{border-radius:4px 7px 7px 4px}
.legend{display:flex;flex-direction:column;gap:9px}
.lrow{display:flex;align-items:center;gap:9px}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.lname{flex:1;font-size:13px;line-height:16px;font-weight:600}
.lval{font-size:13px;line-height:17px;font-weight:800;font-variant-numeric:tabular-nums}
.lpct{width:38px;text-align:right;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btnRow{display:flex;align-items:center;gap:10px}
.btnRow > *{flex:1}
.btn{min-height:48px;border-radius:var(--rMd);display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:700}
.btn.sec{background:var(--primarySoft);border:1px solid var(--primaryBorder);color:var(--primary)}
.btn.out{background:transparent;border:1px solid var(--border);color:var(--primary)}
.btn.sm{min-height:38px;font-size:13px;padding:0 16px}

/* ---------- list rows ---------- */
.group{display:flex;flex-direction:column;gap:8px}
.rowgroup{border:1px solid var(--border);border-radius:var(--rXxl);background:var(--card);padding:0 16px}
.lrowi{min-height:52px;display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--divider)}
.lrowi:last-child{border-bottom:0}
.lrowi .t{flex:1;font-size:14px;line-height:21px;font-weight:700}

/* ---------- profil ---------- */
.ident{flex-direction:row;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:var(--rXl);background:var(--primary);color:var(--onPrimary);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:none}
.identText{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.scopeRow{display:flex;align-items:center;gap:12px}
.scopeText{flex:1;display:flex;flex-direction:column;gap:2px}

/* ---------- fab ---------- */
.fab{position:absolute;right:16px;bottom:calc(var(--tabh) + 16px);height:52px;padding:0 20px;border-radius:999px;
  background:var(--primary);color:#fff;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;
  box-shadow:var(--elBrand);z-index:6}

/* ---------- tab bar ---------- */
:root{--tabh:83px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);z-index:7;
  background:rgba(252,253,252,.86);backdrop-filter:blur(24px);border-top:1px solid rgba(23,107,58,.10);
  box-shadow:0 -6px 20px rgba(18,42,25,.06);display:flex;flex-direction:column}
.tabs{flex:1;display:flex;align-items:center;padding-top:6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
.tab span{font-size:11px;line-height:13px;font-weight:600}
.tab.on{color:var(--primary)}
.tab.on span{font-weight:700}
.homeind{height:22px;display:flex;align-items:center;justify-content:center}
.homeind i{width:140px;height:5px;border-radius:3px;background:rgba(23,35,28,.28)}

/* tablet tweaks */
.tablet .scroll{padding-left:32px;padding-right:32px}
.tablet{--tabh:74px}
.tablet .homeind i{width:180px}
</style>
</head>

  <div class="statusbar">
    <div>09:41</div>
    <div class="sb-r">
      <div class="sig"><i></i><i></i><i></i><i></i></div>
      <div class="wifi"></div>
      <div class="batt"></div>
    </div>
  </div>
  <div class="scroll"><div class="wrap" id="wrap"></div></div>

document.getElementById('tabs').innerHTML = TABS.map(([ic,label,key]) =>

      <div class="cap t2 ellip">${meta}</div>

      </div>
    </div>
  </div>`;
